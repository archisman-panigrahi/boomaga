name: Debian build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            cups \
            debhelper \
            devscripts \
            dpkg-dev \
            fakeroot \
            libcups2-dev \
            libpoppler-cpp-dev \
            libpoppler-dev \
            libsnappy-dev \
            pkg-config \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp ../boomaga_* artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boomaga-debian-packages
          path: artifacts/*
